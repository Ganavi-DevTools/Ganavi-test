name: Check New Collaborators and Create Issues

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes

permissions:
  issues: write
  contents: read

jobs:
  check-new-collaborators:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current list of collaborators
        run: |
          curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/collaborators \
            > collaborators_current.json

      - name: Compare with previous list
        run: |
          if [ -f collaborators_previous.json ]; then
            new_collaborators=$(jq -r '.[].login' collaborators_current.json | sort | comm -13 <(jq -r '.[].login' collaborators_previous.json | sort) -)
            if [ -n "$new_collaborators" ]; then
              echo "New collaborators detected: $new_collaborators"
              echo "$new_collaborators" > new_collaborators.txt
            fi
          fi
          mv collaborators_current.json collaborators_previous.json

      - name: Create issues for new collaborators
        if: success() && steps.compare-with-previous-list.outputs.new_collaborators != ''
        run: |
          while IFS= read -r collaborator; do
            curl -X POST -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
              -d "{\"title\": \"Welcome $collaborator!\", \"body\": \"Hello $collaborator, welcome to the repository!\"}" \
              https://api.github.com/repos/${{ github.repository }}/issues
          done < new_collaborators.txt
