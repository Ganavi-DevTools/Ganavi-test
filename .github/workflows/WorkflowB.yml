name: Workflow B

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create demo artifact
        run: echo "artifact created by Workflow B on branch ${GITHUB_REF_NAME}" > artifact.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-artifact
          path: artifact.txt
