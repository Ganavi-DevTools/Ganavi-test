name: Workflow event filter & Activity Types
on:
    workflow_dispatch:
    push:
        #  branches-ignore: 
        #     - feature/*
        #     - test/**   
        branches:  
            - master   
            - '!feature/*'
    pull_request:
        types:
            - opened
            - closed
        paths-ignore:
            -README.md
        branches:
            -main
    
jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
          - run: echo this wrokflow/job/step is executed for event type - ${{github.event_name}}